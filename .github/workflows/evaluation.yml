name: Stock evaluation
on:
  pull_request:
  push:
    branches: [portfolio-readiness/stock-evaluation]
permissions:
  contents: read
jobs:
  evaluation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
